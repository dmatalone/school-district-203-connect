<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>District 203 Computer Display</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#06110d;color:#fff}body{display:flex;align-items:center;justify-content:center}.panel{width:min(760px,92%);background:#18392d;border:1px solid rgba(255,255,255,.08);padding:30px;border-radius:24px}.brand{font-size:40px;font-weight:900}.brand span{color:#61c69f}.sub{color:#b8d1c7;margin:6px 0 24px}.label{display:block;font-weight:800;margin-bottom:8px}.row{display:flex;gap:10px}.row input{flex:1;min-width:0;background:#081510;border:1px solid #36594b;color:#fff;padding:16px;border-radius:14px;font-size:24px;letter-spacing:6px}.row button{border:0;border-radius:14px;padding:16px 24px;font-size:17px;font-weight:900;background:#61c69f;color:#07110d;cursor:pointer}.status{margin-top:14px;padding:13px 14px;background:#091712;border-radius:12px;color:#b8d1c7}.tiny{font-size:13px;color:#a8c1b7;line-height:1.5;margin-top:12px}#screen{display:none;width:100%;height:100%;object-fit:contain;background:#000}.overlay{display:none;position:fixed;top:16px;right:16px;z-index:10}.overlay button{border:0;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer}@media(max-width:600px){.row{flex-direction:column}.brand{font-size:31px}}</style></head><body><main id="panel" class="panel"><div class="brand">School District <span>203</span></div><div class="sub">Computer Display</div><label class="label" for="code">Enter the ONE 6-digit code shown on the phone</label><div class="row"><input id="code" inputmode="numeric" maxlength="6" placeholder="123456"><button id="connect">Connect</button></div><div id="status" class="status">Waiting for phone code…</div><div class="tiny">Only the phone creates the pairing code. This computer page does not create a second code. After a live stream arrives, the video fills this tab. Click Full Screen if your browser blocks automatic fullscreen.</div></main><video id="screen" autoplay playsinline></video><div id="overlay" class="overlay"><button id="fs">⛶ Full Screen</button></div><script>const peer=new Peer();let conn=null;const code=document.getElementById('code'),status=document.getElementById('status'),panel=document.getElementById('panel'),screen=document.getElementById('screen'),overlay=document.getElementById('overlay');function setStatus(t){status.textContent=t}document.getElementById('connect').addEventListener('click',()=>{const c=code.value.trim();if(!/^\d{6}$/.test(c)){setStatus('Enter the 6-digit code shown on the phone.');return}if(!peer.id){setStatus('Connection is still starting. Try again in a second.');return}if(conn){try{conn.close()}catch(e){}}setStatus('Connecting to phone…');conn=peer.connect('district203-phone-'+c,{reliable:true});conn.on('open',()=>{setStatus('Connected. Waiting for the phone broadcast…');conn.send({type:'computer-ready',viewerId:peer.id})});conn.on('close',()=>setStatus('Disconnected.'));conn.on('error',()=>setStatus('Could not connect. Check the code and try again.'))});peer.on('call',call=>{call.answer();call.on('stream',stream=>{screen.srcObject=stream;panel.style.display='none';screen.style.display='block';overlay.style.display='block';screen.play().catch(()=>{});tryFullscreen()});call.on('close',()=>{panel.style.display='block';screen.style.display='none';screen.srcObject=null;overlay.style.display='none';setStatus('Live screen ended.')})});peer.on('error',e=>setStatus('Connection error: '+e.type));async function tryFullscreen(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen()}catch(e){overlay.style.display='block'}}document.getElementById('fs').addEventListener('click',tryFullscreen);document.addEventListener('fullscreenchange',()=>{overlay.style.display=document.fullscreenElement?'none':'block'});</script></body></html>
