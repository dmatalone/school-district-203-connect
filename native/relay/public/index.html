<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>District 203 Computer Display</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui;background:#06110d;color:#fff}.setup{width:min(700px,92%);margin:70px auto;background:#18392d;padding:28px;border-radius:24px}.brand{font-size:38px;font-weight:900}.brand span{color:#61c69f}.row{display:flex;gap:10px;margin-top:18px}input{flex:1;min-width:0;background:#081510;border:1px solid #36594b;color:#fff;padding:16px;border-radius:14px;font-size:22px;letter-spacing:5px}button{border:0;border-radius:14px;padding:16px 22px;font-weight:900;font-size:17px;background:#61c69f;color:#07110d;cursor:pointer}.status{margin-top:14px;color:#b8d1c7}.screen{display:none;position:fixed;inset:0;background:#000;align-items:center;justify-content:center}.screen img{width:100%;height:100%;object-fit:contain}.fs{position:fixed;top:18px;right:18px;z-index:5;background:rgba(255,255,255,.92);color:#111}</style></head><body><main id="setup" class="setup"><div class="brand">School District <span>203</span></div><p>Enter the 6-digit code shown in the iPhone app.</p><div class="row"><input id="code" inputmode="numeric" maxlength="6" placeholder="123456"><button id="connect">Connect</button></div><div id="status" class="status">Waiting for code…</div></main><section id="screen" class="screen"><img id="frame" alt="Live iPhone screen"></section><button id="fs" class="fs" hidden>⛶ Full Screen</button><script>let ws=null,lastURL=null;const setup=document.getElementById('setup'),screen=document.getElementById('screen'),frame=document.getElementById('frame'),status=document.getElementById('status'),fs=document.getElementById('fs');document.getElementById('connect').addEventListener('click',()=>{const code=document.getElementById('code').value.trim();if(!/^\d{6}$/.test(code)){status.textContent='Enter the 6-digit iPhone code.';return}if(ws)try{ws.close()}catch{};const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}`);ws.binaryType='blob';status.textContent='Connecting…';ws.onopen=()=>ws.send(JSON.stringify({type:'viewer',code}));ws.onmessage=e=>{if(typeof e.data==='string'){try{const m=JSON.parse(e.data);if(m.type==='joined'){status.textContent='Connected — waiting for iPhone broadcast…';}}catch{}return}if(lastURL)URL.revokeObjectURL(lastURL);lastURL=URL.createObjectURL(e.data);frame.src=lastURL;setup.style.display='none';screen.style.display='flex';fs.hidden=false;};ws.onclose=()=>{status.textContent='Disconnected.'}});async function goFullscreen(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen()}catch{}}fs.addEventListener('click',goFullscreen);document.addEventListener('fullscreenchange',()=>{fs.hidden=!!document.fullscreenElement});</script></body></html>
