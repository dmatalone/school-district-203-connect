<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>District 203 Computer Screen Share</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#07110d;--card:#173529;--text:#f7fbf9;--muted:#a9beb4;--accent:#55c99d;--accent2:#2d9e78;--good:#43d17c;--bad:#ff7d7d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at top,#18392d,#07110d 65%);color:var(--text)}body{padding:24px}.wrap{max-width:820px;margin:auto}.brand{font-size:38px;font-weight:900;letter-spacing:-1.5px}.brand span{color:var(--accent)}.sub{color:var(--muted);margin:5px 0 22px}.card{background:rgba(23,53,41,.96);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:22px;margin-bottom:16px}.codeLabel{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}.code{font-size:68px;font-weight:900;letter-spacing:10px;margin:4px 0 12px;word-break:break-all}.status{padding:12px 14px;border-radius:13px;background:#0b1712;color:var(--muted);margin-top:12px}.ok{color:var(--good)}.bad{color:var(--bad)}button{border:0;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:850;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--accent2),var(--accent));margin-right:10px;margin-top:10px}button.secondary{background:#29483d}.tiny{font-size:13px;color:var(--muted);line-height:1.5;margin-top:10px}video{width:100%;max-height:420px;background:#000;border-radius:16px;margin-top:14px;display:none}.row{display:flex;flex-wrap:wrap;gap:8px}@media(max-width:600px){.brand{font-size:31px}.code{font-size:48px;letter-spacing:7px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">School District <span>203</span></div>
  <div class="sub">Windows Computer Screen Share</div>

  <div class="card">
    <div class="codeLabel">Phone pairing code</div>
    <div id="code" class="code">------</div>
    <div class="row">
      <button id="startBtn" onclick="startShare()">Start Screen Share</button>
      <button class="secondary" onclick="stopShare()">Stop Sharing</button>
    </div>
    <div id="status" class="status">Starting connection…</div>
    <div class="tiny">When Windows asks what to share, choose <strong>Entire Screen</strong> if you want your phone to keep showing everything as you open different apps and windows.</div>
    <video id="preview" autoplay muted playsinline></video>
  </div>
</div>
<script>
const code=String(Math.floor(100000+Math.random()*900000));
const codeEl=document.getElementById('code');
const statusEl=document.getElementById('status');
const preview=document.getElementById('preview');
codeEl.textContent=code;
let screenStream=null;
let activeConn=null;
let activeCall=null;
let pendingViewerId=null;
const peer=new Peer('district203-screen-'+code);

function setStatus(msg,type=''){
  statusEl.textContent=msg;
  statusEl.className='status'+(type?' '+type:'');
}

peer.on('open',()=>setStatus('Ready. Click Start Screen Share, then enter this code on your phone.'));
peer.on('error',err=>setStatus('Connection error: '+err.type,'bad'));
peer.on('connection',conn=>{
  if(activeConn){try{activeConn.close()}catch(e){}}
  activeConn=conn;
  conn.on('open',()=>setStatus('Phone connected. Waiting for screen share…','ok'));
  conn.on('data',data=>{
    if(data&&data.type==='viewer-ready'&&data.viewerId){
      pendingViewerId=data.viewerId;
      setStatus('Phone paired. Starting live screen…','ok');
      startCallIfReady();
    }
  });
  conn.on('close',()=>setStatus('Phone disconnected. You can reconnect with the same code.'));
});

async function startShare(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia){
    setStatus('This browser does not support screen sharing. Use current Chrome or Edge on Windows.','bad');
    return;
  }
  try{
    if(screenStream) stopShare();
    screenStream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30},audio:false});
    preview.srcObject=screenStream;
    preview.style.display='block';
    setStatus('Screen selected. Now connect your phone with the code above.','ok');
    const track=screenStream.getVideoTracks()[0];
    track.addEventListener('ended',()=>stopShare());
    startCallIfReady();
  }catch(err){
    setStatus('Screen sharing was cancelled or blocked. Click Start Screen Share and try again.','bad');
  }
}

function startCallIfReady(){
  if(!screenStream||!pendingViewerId)return;
  if(activeCall){try{activeCall.close()}catch(e){}}
  activeCall=peer.call(pendingViewerId,screenStream);
  activeCall.on('close',()=>setStatus('Live screen ended.','bad'));
  activeCall.on('error',()=>setStatus('Could not send the screen to the phone.','bad'));
  setStatus('Live screen is being sent to your phone.','ok');
}

function stopShare(){
  if(activeCall){try{activeCall.close()}catch(e){} activeCall=null;}
  if(screenStream){screenStream.getTracks().forEach(t=>t.stop());screenStream=null;}
  preview.srcObject=null;preview.style.display='none';
  setStatus('Screen sharing stopped. The pairing code is still active.');
}
</script>
</body>
</html>
