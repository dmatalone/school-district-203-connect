<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ConnectCast Receiver</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{--bg:#050914;--panel:#11182a;--text:#f6f8ff;--muted:#95a1bd;--accent:#6ea8fe;--good:#49d17d}
  *{box-sizing:border-box} html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#050914;color:var(--text)}
  body{overflow:hidden}
  #stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,#111a32,#050914 70%)}
  #welcome{text-align:center;padding:30px}.brand{font-size:42px;font-weight:900;letter-spacing:-2px}.brand span{color:var(--accent)}
  .codeLabel{margin-top:32px;color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:2px}.code{font-size:72px;font-weight:900;letter-spacing:12px;margin:5px 0 10px}.status{color:var(--muted)}
  .connected{color:var(--good);font-weight:800}
  #content{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:50px;text-align:center}
  #contentText{font-size:clamp(34px,6vw,86px);font-weight:850;line-height:1.08;max-width:1200px;white-space:pre-wrap;word-break:break-word}
  #iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:white;display:none}
  #image{max-width:100%;max-height:100%;object-fit:contain;display:none}
  .topbar{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:20;pointer-events:none}
  .pill{background:rgba(12,18,33,.78);border:1px solid rgba(255,255,255,.08);padding:10px 14px;border-radius:999px;font-size:13px;color:#c9d1e5;backdrop-filter:blur(10px)}
  button{pointer-events:auto;border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;background:white;color:#111}
</style>
</head>
<body>
<div id="stage">
  <div id="welcome">
    <div class="brand">Connect<span>Cast</span></div>
    <div class="codeLabel">Connection code</div>
    <div id="code" class="code">------</div>
    <div id="status" class="status">Starting receiver…</div>
  </div>
  <div id="content"><div id="contentText"></div><img id="image" alt=""></div>
  <iframe id="iframe" allow="autoplay; fullscreen"></iframe>
</div>
<div class="topbar">
  <div class="pill">Receiver • <span id="miniCode">------</span></div>
  <button onclick="showHome()">Show Code</button>
</div>
<script>
const code = String(Math.floor(100000 + Math.random()*900000));
document.getElementById('code').textContent = code;
document.getElementById('miniCode').textContent = code;

const peer = new Peer('connectcast-' + code);
let activeConn = null;

peer.on('open', () => {
  document.getElementById('status').textContent = 'Ready — enter this code on your phone';
});
peer.on('connection', conn => {
  if (activeConn) { try { activeConn.close(); } catch(e){} }
  activeConn = conn;
  conn.on('open', () => {
    document.getElementById('status').innerHTML = '<span class="connected">● Phone connected</span>';
  });
  conn.on('data', data => handleData(data));
  conn.on('close', () => {
    document.getElementById('status').textContent = 'Phone disconnected — waiting…';
  });
});
peer.on('error', err => {
  document.getElementById('status').textContent = 'Connection error: ' + err.type;
});

function resetViews(){
  document.getElementById('welcome').style.display='none';
  document.getElementById('content').style.display='none';
  document.getElementById('iframe').style.display='none';
  document.getElementById('image').style.display='none';
}
function showHome(){
  resetViews();
  document.getElementById('welcome').style.display='block';
}
function handleData(data){
  if(!data || !data.type) return;
  if(data.type==='text'){
    resetViews();
    const box=document.getElementById('content');
    box.style.display='flex';
    document.getElementById('contentText').textContent=data.value || '';
  }
  if(data.type==='url'){
    resetViews();
    const frame=document.getElementById('iframe');
    frame.src=data.value;
    frame.style.display='block';
  }
  if(data.type==='image'){
    resetViews();
    const img=document.getElementById('image');
    img.src=data.value;
    document.getElementById('content').style.display='flex';
    img.style.display='block';
  }
  if(data.type==='home') showHome();
  if(data.type==='blank'){
    resetViews();
  }
  if(data.type==='color'){
    document.getElementById('stage').style.background=data.value;
  }
}
</script>
</body>
</html>
