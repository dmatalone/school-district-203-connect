<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>School District 203 Controller</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><style>:root{--bg:#0a1410;--card:#173529;--text:#f7fbf9;--muted:#a9beb4;--accent:#55c99d;--accent2:#2d9e78;--good:#43d17c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#1a3d31,#09110e 45%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}.wrap{max-width:620px;margin:auto;padding:22px 0 40px}.header{display:flex;align-items:center;gap:13px;margin-bottom:20px}.logo{width:62px;height:62px;object-fit:cover;border-radius:14px}.brand{font-size:28px;font-weight:900;letter-spacing:-1.5px}.brand span{color:var(--accent)}.sub{color:var(--muted);margin-top:2px}.card{background:rgba(23,53,41,.96);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 18px 40px rgba(0,0,0,.22)}label{display:block;font-size:13px;font-weight:800;color:#d0ddd7;margin-bottom:8px}input,textarea{width:100%;background:#0b1712;border:1px solid #315446;color:white;border-radius:14px;padding:14px;font-size:16px;outline:none}input:focus,textarea:focus{border-color:var(--accent)}textarea{min-height:120px;resize:vertical}.row{display:flex;gap:10px}.row>*{flex:1}button{width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:15px;font-weight:850;cursor:pointer;background:linear-gradient(135deg,var(--accent2),var(--accent));color:white}button.secondary{background:#29483d}.status{padding:11px 13px;border-radius:13px;background:#0b1712;color:var(--muted);font-size:14px;margin-top:12px}.status.ok{color:var(--good)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tiny{font-size:12px;color:var(--muted);line-height:1.45;margin-top:8px}</style></head><body><div class="wrap"><div class="header"><img class="logo" src="school-district-203-logo.png" alt="School District 203 logo"><div><div class="brand">School District <span>203</span></div><div class="sub">Phone Controller • DM Elementary</div></div></div><div class="card"><label>Computer connection code</label><div class="row"><input id="code" inputmode="numeric" maxlength="6" placeholder="123456"><button onclick="connectToReceiver()">Connect</button></div><div id="status" class="status">Not connected</div></div><div class="card"><label>Display a message</label><textarea id="text" placeholder="Type something to show on the computer…"></textarea><button style="margin-top:10px" onclick="sendText()">Show Message</button></div><div class="card"><label>Open a website on the receiver</label><input id="url" placeholder="https://example.com"><button style="margin-top:10px" onclick="sendUrl()">Open Website</button><div class="tiny">Some websites block embedded display.</div></div><div class="card"><label>Send an image</label><input id="file" type="file" accept="image/*"><button style="margin-top:10px" onclick="sendImage()">Show Image</button></div><div class="card"><label>Receiver controls</label><div class="grid"><button class="secondary" onclick="send({type:'home'})">Show Code</button><button class="secondary" onclick="send({type:'blank'})">Blank Screen</button></div></div></div><script>const peer=new Peer();let conn=null;peer.on('error',err=>setStatus('Error: '+err.type,false));function setStatus(msg,ok){const s=document.getElementById('status');s.textContent=msg;s.className='status'+(ok?' ok':'');}function connectToReceiver(){const code=document.getElementById('code').value.trim();if(!/^\d{6}$/.test(code)){setStatus('Enter the 6-digit code from the computer.',false);return;}setStatus('Connecting…',false);conn=peer.connect('district203-'+code,{reliable:true});conn.on('open',()=>setStatus('● Connected to computer',true));conn.on('close',()=>setStatus('Disconnected',false));conn.on('error',()=>setStatus('Could not connect',false));}function send(data){if(!conn||!conn.open){setStatus('Connect to the computer first.',false);return;}conn.send(data);}function sendText(){send({type:'text',value:document.getElementById('text').value});}function sendUrl(){let u=document.getElementById('url').value.trim();if(u&&!/^https?:\/\//i.test(u))u='https://'+u;send({type:'url',value:u});}function sendImage(){const f=document.getElementById('file').files[0];if(!f){setStatus('Choose an image first.',false);return;}if(f.size>3*1024*1024){setStatus('Use an image under 3 MB.',false);return;}const r=new FileReader();r.onload=()=>send({type:'image',value:r.result});r.readAsDataURL(f);}</script></body></html>
