<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>District 203 Phone Share</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#193b2f,#09110e 48%);color:#fff;font-family:system-ui;min-height:100vh;padding:18px}.wrap{max-width:650px;margin:auto}.brand{font-size:32px;font-weight:900}.brand span{color:#61c69f}.sub{color:#b8d1c7}.card{margin-top:20px;background:#18392d;border-radius:22px;padding:22px}.label{text-transform:uppercase;letter-spacing:2px;color:#a8c1b7;font-size:12px}.code{font-size:60px;font-weight:900;letter-spacing:8px;margin:8px 0 14px}.status{padding:12px;background:#091712;border-radius:12px;color:#b8d1c7;margin:12px 0}button{width:100%;border:0;border-radius:14px;padding:16px;font-weight:900;font-size:17px;background:#61c69f;color:#07110d}.tiny{font-size:13px;color:#a8c1b7;line-height:1.5;margin-top:12px}</style></head><body><main class="wrap"><div class="brand">School District <span>203</span></div><div class="sub">Phone Screen Share</div><section class="card"><div class="label">Enter this code on the computer</div><div id="code" class="code">------</div><div id="status" class="status">Starting…</div><button id="share">Start Phone Screen Share</button><div class="tiny">Your phone/browser must support screen capture. On iPhone, Safari generally cannot share the entire iPhone screen from a normal webpage; this works only where the browser offers screen sharing.</div></section></main><script>const code=String(Math.floor(100000+Math.random()*900000));document.getElementById('code').textContent=code;const status=document.getElementById('status');let stream=null,computerId=null,call=null;const peer=new Peer('district203-phone-'+code);peer.on('open',()=>status.textContent='Ready — type this code on the computer.');peer.on('connection',conn=>{conn.on('open',()=>status.textContent='Computer connected. Tap Start Phone Screen Share.');conn.on('data',d=>{if(d&&d.type==='computer-ready'){computerId=d.viewerId;status.textContent='Computer paired. Tap Start Phone Screen Share.';startIfReady()}})});peer.on('error',e=>status.textContent='Connection error: '+e.type);document.getElementById('share').addEventListener('click',async()=>{if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia){status.textContent='This phone browser does not support sharing the phone screen from a webpage.';return}try{stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});status.textContent='Screen selected. Waiting for computer…';startIfReady()}catch(e){status.textContent='Screen sharing was cancelled or is not supported.'}});function startIfReady(){if(!stream||!computerId)return;if(call)try{call.close()}catch(e){}call=peer.call(computerId,stream);status.textContent='LIVE — phone screen is being sent to the computer.'}</script></body></html>
