<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>District 203 Phone Viewer</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#09110e;--card:#173529;--text:#f7fbf9;--muted:#a9beb4;--accent:#55c99d;--accent2:#2d9e78;--good:#43d17c;--bad:#ff7d7d}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#193b2f,#09110e 48%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}.wrap{max-width:760px;margin:auto;padding:18px 0 30px}.brand{font-size:30px;font-weight:900;letter-spacing:-1.4px}.brand span{color:var(--accent)}.sub{color:var(--muted);margin:4px 0 18px}.card{background:rgba(23,53,41,.96);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:16px;margin-bottom:14px}label{display:block;font-size:13px;font-weight:800;color:#d0ddd7;margin-bottom:8px}input{width:100%;background:#0b1712;border:1px solid #315446;color:#fff;border-radius:14px;padding:14px;font-size:18px;outline:none}input:focus{border-color:var(--accent)}.row{display:flex;gap:10px}.row>*{min-width:0}.row input{flex:1}.row button{width:auto;min-width:120px}button{border:0;border-radius:14px;padding:14px 16px;font-size:15px;font-weight:850;cursor:pointer;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff}.status{padding:11px 13px;border-radius:13px;background:#0b1712;color:var(--muted);font-size:14px;margin-top:12px}.status.ok{color:var(--good)}.status.bad{color:var(--bad)}.viewer{background:#000;border-radius:18px;overflow:hidden;min-height:220px;display:grid;place-items:center}.viewer video{display:none;width:100%;height:auto;max-height:72vh;background:#000}.placeholder{padding:40px 18px;text-align:center;color:#8fa69b;line-height:1.5}.tiny{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px}@media(max-width:520px){.row{display:block}.row button{width:100%;margin-top:10px}.viewer{min-height:190px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">School District <span>203</span></div>
  <div class="sub">Phone Screen Viewer</div>

  <div class="card">
    <label for="code">Computer pairing code</label>
    <div class="row">
      <input id="code" inputmode="numeric" maxlength="6" placeholder="123456">
      <button id="connectBtn">Connect</button>
    </div>
    <div id="status" class="status">Not connected</div>
    <div class="tiny">On the computer, click <strong>Start Screen Share</strong> and choose <strong>Entire Screen</strong>. Then enter the computer's 6-digit code here.</div>
  </div>

  <div class="card">
    <div class="viewer">
      <div id="placeholder" class="placeholder">Your computer screen will appear here after pairing.</div>
      <video id="screen" autoplay playsinline controls></video>
    </div>
  </div>
</div>
<script>
const peer=new Peer();
let conn=null;
let activeCall=null;
const statusEl=document.getElementById('status');
const codeEl=document.getElementById('code');
const screen=document.getElementById('screen');
const placeholder=document.getElementById('placeholder');
const connectBtn=document.getElementById('connectBtn');

function setStatus(msg,type=''){
  statusEl.textContent=msg;
  statusEl.className='status'+(type?' '+type:'');
}

peer.on('open',()=>{});
peer.on('error',err=>setStatus('Connection error: '+err.type,'bad'));
peer.on('call',call=>{
  if(activeCall){try{activeCall.close()}catch(e){}}
  activeCall=call;
  call.answer();
  call.on('stream',remoteStream=>{
    screen.srcObject=remoteStream;
    screen.style.display='block';
    placeholder.style.display='none';
    setStatus('● Live computer screen connected','ok');
    screen.play().catch(()=>{});
  });
  call.on('close',()=>{
    setStatus('Screen share ended.','bad');
    screen.srcObject=null;screen.style.display='none';placeholder.style.display='block';
  });
  call.on('error',()=>setStatus('Could not receive the computer screen.','bad'));
});

connectBtn.addEventListener('click',()=>{
  const code=codeEl.value.trim();
  if(!/^\d{6}$/.test(code)){setStatus('Enter the 6-digit code shown on the computer.','bad');return;}
  if(!peer.id){setStatus('Phone connection is still starting. Try again in a second.','bad');return;}
  setStatus('Pairing with computer…');
  if(conn){try{conn.close()}catch(e){}}
  conn=peer.connect('district203-screen-'+code,{reliable:true});
  conn.on('open',()=>{
    setStatus('Paired. Waiting for the computer screen…','ok');
    conn.send({type:'viewer-ready',viewerId:peer.id});
  });
  conn.on('close',()=>setStatus('Disconnected from computer.','bad'));
  conn.on('error',()=>setStatus('Could not pair. Check the code and try again.','bad'));
});
</script>
</body>
</html>
