<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>District 203 Computer Viewer</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui;background:#06110d;color:#fff}body{display:flex;align-items:center;justify-content:center}.panel{width:min(760px,92%);background:#18392d;padding:28px;border-radius:24px}.brand{font-size:38px;font-weight:900}.brand span{color:#61c69f}.sub{color:#b8d1c7;margin:5px 0 24px}.row{display:flex;gap:10px}input{flex:1;min-width:0;background:#081510;border:1px solid #36594b;color:#fff;padding:16px;border-radius:14px;font-size:22px;letter-spacing:5px}button{border:0;border-radius:14px;padding:16px 22px;font-weight:900;font-size:17px;background:#61c69f;color:#07110d;cursor:pointer}.status{margin-top:14px;padding:13px;background:#091712;border-radius:12px;color:#b8d1c7}.note{font-size:13px;color:#a8c1b7;margin-top:12px}#screen{display:none;width:100%;height:100%;object-fit:contain;background:#000}.overlay{display:none;position:fixed;right:18px;top:18px;z-index:10}#fs{background:rgba(255,255,255,.92);color:#111}@media(max-width:600px){.row{flex-direction:column}.brand{font-size:30px}}</style></head><body><main id="panel" class="panel"><div class="brand">School District <span>203</span></div><div class="sub">Computer Display</div><label for="code">Enter the 6-digit code shown on the phone</label><div class="row"><input id="code" inputmode="numeric" maxlength="6" placeholder="123456"><button id="connect">Connect</button></div><div id="status" class="status">Waiting for phone code…</div><div class="note">After connecting, the phone's shared screen will fill this display. Your browser may require one click on Full Screen because browsers do not allow websites to force fullscreen without user permission.</div></main><video id="screen" autoplay playsinline></video><div id="overlay" class="overlay"><button id="fs">⛶ Full Screen</button></div><script>const peer=new Peer();let conn=null;const code=document.getElementById('code'),status=document.getElementById('status'),panel=document.getElementById('panel'),screen=document.getElementById('screen'),overlay=document.getElementById('overlay');function setStatus(t){status.textContent=t}document.getElementById('connect').addEventListener('click',()=>{const c=code.value.trim();if(!/^\d{6}$/.test(c)){setStatus('Enter the 6-digit code shown on the phone.');return}setStatus('Connecting…');conn=peer.connect('district203-phone-'+c,{reliable:true});conn.on('open',()=>{setStatus('Connected — waiting for phone screen…');conn.send({type:'computer-ready',viewerId:peer.id})});conn.on('close',()=>setStatus('Disconnected.'));conn.on('error',()=>setStatus('Could not connect. Check the code and try again.'))});peer.on('call',call=>{call.answer();call.on('stream',stream=>{screen.srcObject=stream;panel.style.display='none';screen.style.display='block';overlay.style.display='block';screen.play().catch(()=>{});tryFullscreen()})});peer.on('error',e=>setStatus('Connection error: '+e.type));async function tryFullscreen(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen()}catch(e){overlay.style.display='block'}}document.getElementById('fs').addEventListener('click',tryFullscreen);document.addEventListener('fullscreenchange',()=>{overlay.style.display=document.fullscreenElement?'none':'block'});</script></body></html>
